when@test:
  doctrine:
    orm:
      entity_managers:
        # The tenant registry lives on the default connection, which is never
        # swapped -- see config/packages/test/doctrine.yaml.
        default:
          mappings:
            TestsDefault:
              is_bundle: false
              type: attribute
              dir: '%kernel.project_dir%/tests/Entity/Default'
              prefix: 'aPajo\MultiTenancyBundle\Tests\Entity\Default'

        # Per-tenant data, reachable only through the swapped connection.
        tenant:
          mappings:
            TestsTenant:
              is_bundle: false
              type: attribute
              dir: '%kernel.project_dir%/tests/Entity/Tenant'
              prefix: 'aPajo\MultiTenancyBundle\Tests\Entity\Tenant'
