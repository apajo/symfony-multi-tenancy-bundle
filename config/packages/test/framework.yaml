framework:
    secret: '%env(APP_SECRET)%'
    test: true
    http_method_override: false

    # SecurityBundle's channel listener depends on router.request_context, so
    # the router has to exist even though the bundle exposes no routes.
    router:
        resource: '%kernel.project_dir%/config/routes.yaml'
        utf8: true
        strict_requirements: null

    session:
        storage_factory_id: session.storage.factory.mock_file
